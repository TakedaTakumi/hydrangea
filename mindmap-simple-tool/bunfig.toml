# Bun configuration file
# https://bun.sh/docs/runtime/bunfig

[install]
# configure behavior of `bun install`
cache = true
exact = false
production = false

[install.cache]
# configure package cache behavior
dir = "~/.bun/install/cache"

[test]
# configure test runner
preload = []
root = "./tests"

[build]
# configure bundler
target = "browser"
format = "esm"
splitting = true
minify = true

[run]
# configure runtime behavior
shell = ["bash", "-c"]
