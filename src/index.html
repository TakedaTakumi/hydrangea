<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>マインドマップ作成ツール</title>
  <!-- js-yaml CDN -->
  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <style>
    /* 全体レイアウト */
    body { margin: 0; font-family: sans-serif; background: #f5f5f5; }
    #toolbar { display: flex; gap: 8px; padding: 8px; background: #fff; border-bottom: 1px solid #ccc; }
    #canvas-container { position: relative; width: 100vw; height: calc(100vh - 48px); overflow: auto; background: #fff; }
    #mindmap-canvas { position: absolute; left: 0; top: 0; }
    .node { cursor: pointer; user-select: none; border-radius: 6px; box-shadow: 1px 1px 4px #ccc; transition: box-shadow 0.2s; }
    .node.selected { box-shadow: 0 0 0 3px #2196f3; }
    .edge { stroke: #000; stroke-width: 2; }
    /* ノード編集UI */
    #node-editor { position: fixed; top: 60px; right: 20px; background: #fff; border: 1px solid #ccc; border-radius: 8px; padding: 12px; display: none; z-index: 10; }
    #node-editor input, #node-editor select { width: 100%; margin-bottom: 8px; }
    /* ファイル入力非表示 */
    #yaml-import { display: none; }
    /* 選択ノードの強調 */
    .node.selected rect {
      stroke: #1976d2;
      stroke-width: 4;
      filter: drop-shadow(0 0 8px #1976d2aa);
    }
    .node.selected text {
      fill: #1976d2;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <!-- ツールバー -->
  <div id="toolbar">
    <button id="new-map">新規作成</button>
    <button id="import-yaml">インポート</button>
    <button id="export-yaml">エクスポート</button>
    <button id="fit-canvas">全体表示</button>
    <input type="file" id="yaml-import" accept=".yaml,.yml,.txt">
  </div>
  <!-- キャンバス -->
  <div id="canvas-container">
    <svg id="mindmap-canvas" width="2000" height="2000"></svg>
  </div>
  <!-- ノード編集UI -->
  <div id="node-editor">
    <label>テキスト<input type="text" id="node-content"></label>
    <label>色<input type="color" id="node-color"></label>
    <button id="save-node">保存</button>
    <button id="delete-node">削除</button>
    <button id="close-editor">閉じる</button>
  </div>
  <script>
    // --- データモデル定義 ---
    // ノードID生成用（ulid風の簡易ID）
    function generateId() {
      return 'node_' + Math.random().toString(36).substr(2, 9);
    }

    // デフォルトスタイル
    const defaultNodeStyle = {
      inherit_style: true,
      fill: '#fff',
      stroke: '#000',
      edge: { color: '#000', type: 'solid', width: 2 },
      font: { family: '', size: 14, color: '', bold: false, italic: false, under: false }
    };

    // 初期データ（YAMLモデル準拠）
    let mindmapData = {
      background_color: '#fff',
      defaults: {
        node: { content: '新しいノード', icon: '', margin: 10, padding: 5, collapsed: false },
        style: JSON.parse(JSON.stringify(defaultNodeStyle))
      },
      root: {
        content: '新しいマップ',
        right: { icon: '', children: [], collapsed: false },
        left: { icon: '', children: [], collapsed: false },
        style: JSON.parse(JSON.stringify(defaultNodeStyle))
      },
      node_list: {}
    };

    // --- 選択ノードID・編集状態管理 ---
    let selectedNodeId = null;
    let selectedNodeSide = null; // 'left' or 'right' or null

    // --- ノードデータ取得 ---
    function getNodeById(id) {
      return mindmapData.node_list[id];
    }

    // --- ノード追加 ---
    function addNode(parentId, side) {
      const newId = generateId();
      mindmapData.node_list[newId] = {
        content: '',
        icon: '',
        children: [],
        style: JSON.parse(JSON.stringify(defaultNodeStyle)),
        collapsed: false
      };
      if (parentId === 'root') {
        mindmapData.root[side].children.push(newId);
      } else {
        mindmapData.node_list[parentId].children.push(newId);
      }
      return newId;
    }

    // --- ノード削除 ---
    function deleteNode(nodeId, parentId, side) {
      // 子ノードも再帰的に削除
      const node = mindmapData.node_list[nodeId];
      if (node && node.children) {
        node.children.forEach(childId => deleteNode(childId, nodeId));
      }
      delete mindmapData.node_list[nodeId];
      // 親から参照を削除
      if (parentId === 'root') {
        const arr = mindmapData.root[side].children;
        mindmapData.root[side].children = arr.filter(id => id !== nodeId);
      } else if (parentId) {
        const arr = mindmapData.node_list[parentId].children;
        mindmapData.node_list[parentId].children = arr.filter(id => id !== nodeId);
      }
    }

    // --- ノード移動 ---
    function moveNode(nodeId, fromParentId, toParentId, toSide) {
      // 親から削除
      if (fromParentId === 'root') {
        mindmapData.root[toSide].children = mindmapData.root[toSide].children.filter(id => id !== nodeId);
      } else {
        mindmapData.node_list[fromParentId].children = mindmapData.node_list[fromParentId].children.filter(id => id !== nodeId);
      }
      // 新しい親に追加
      if (toParentId === 'root') {
        mindmapData.root[toSide].children.push(nodeId);
      } else {
        mindmapData.node_list[toParentId].children.push(nodeId);
      }
    }

    // --- ノード内容・色編集 ---
    function updateNode(nodeId, content, color) {
      if (!mindmapData.node_list[nodeId]) return;
      mindmapData.node_list[nodeId].content = content;
      mindmapData.node_list[nodeId].style.fill = color;
    }

    // --- ノード折りたたみ ---
    function toggleCollapse(nodeId) {
      if (!mindmapData.node_list[nodeId]) return;
      mindmapData.node_list[nodeId].collapsed = !mindmapData.node_list[nodeId].collapsed;
    }

    // --- ルートノード内容・色編集 ---
    function updateRoot(content, color) {
      mindmapData.root.content = content;
      mindmapData.root.style.fill = color;
    }

    // --- マインドマップ描画・操作ロジック ---
    // SVGキャンバス取得
    const svg = document.getElementById('mindmap-canvas');
    // キャンバス中心座標
    const centerX = 1000, centerY = 1000;
    // ノード間距離を3分の1に調整
    const nodeGapX = 50, nodeGapY = 60;

    // マインドマップ全体を描画
    function renderMindmap() {
      // SVG初期化
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      // ルートノード描画
      drawRootNode();
      // 右側ノード描画
      drawBranch('right', centerX + nodeGapX, centerY, mindmapData.root.right.children, 'root', 1);
      // 左側ノード描画
      drawBranch('left', centerX - nodeGapX, centerY, mindmapData.root.left.children, 'root', -1);
    }

    // ルートノード描画
    function drawRootNode() {
      // ノード矩形
      const g = createNodeElement('root', mindmapData.root.content, mindmapData.root.style.fill, centerX, centerY, true);
      svg.appendChild(g);
    }

    // --- サブツリー高さ計算関数を追加 ---
    // ノードIDを受け取り、そのノードのサブツリー全体の高さを返す
    function calcSubtreeHeight(nodeId) {
      const node = mindmapData.node_list[nodeId];
      if (!node || node.collapsed || node.children.length === 0) {
        return 40; // ノード自身の高さ（固定）
      }
      // 子ノードのサブツリー高さ合計＋ギャップ合計
      let total = 0;
      const childHeights = node.children.map(cid => calcSubtreeHeight(cid));
      total = childHeights.reduce((a, b) => a + b, 0);
      total += (node.children.length - 1) * nodeGapY;
      return Math.max(40, total);
    }

    // --- drawBranchをサブツリー高さ考慮で修正 ---
    function drawBranch(side, x, y, children, parentId, dir, depth = 1) {
      // 各子ノードのサブツリー高さを取得
      const subtreeHeights = children.map(id => calcSubtreeHeight(id));
      const nodeWidths = children.map(id => {
        const node = mindmapData.node_list[id];
        if (!node) return 120;
        // 仮ノードで横幅計算
        const minWidth = 120;
        const fontSize = 14;
        const tempText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        tempText.setAttribute('font-size', fontSize);
        tempText.setAttribute('font-family', 'sans-serif');
        tempText.textContent = node.content || '(空)';
        svg.appendChild(tempText);
        const bbox = tempText.getBBox();
        svg.removeChild(tempText);
        return Math.max(minWidth, bbox.width + 32);
      });
      // 子ノード全体の高さ合計
      const totalHeight = subtreeHeights.reduce((a, b) => a + b, 0) + (children.length - 1) * nodeGapY;
      // 最初の子ノードのY座標を計算
      let offsetY = y - totalHeight / 2 + subtreeHeights[0] / 2;
      children.forEach((id, idx) => {
        const node = mindmapData.node_list[id];
        if (!node) return;
        const rectWidth = nodeWidths[idx];
        // エッジ描画
        let parentRectWidth = 120;
        if (parentId !== 'root') {
          const parentNode = mindmapData.node_list[parentId];
          if (parentNode) {
            const tempText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            tempText.setAttribute('font-size', 14);
            tempText.setAttribute('font-family', 'sans-serif');
            tempText.textContent = parentNode.content || '(空)';
            svg.appendChild(tempText);
            const bbox = tempText.getBBox();
            svg.removeChild(tempText);
            parentRectWidth = Math.max(120, bbox.width + 32);
          }
        } else {
          const tempText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          tempText.setAttribute('font-size', 18);
          tempText.setAttribute('font-family', 'sans-serif');
          tempText.textContent = mindmapData.root.content || '(空)';
          svg.appendChild(tempText);
          const bbox = tempText.getBBox();
          svg.removeChild(tempText);
          parentRectWidth = Math.max(120, bbox.width + 32);
        }
        const edgeGap = nodeGapX;
        let nodeX;
        if (side === 'right') {
          nodeX = x + parentRectWidth/2 + edgeGap + rectWidth/2;
        } else {
          nodeX = x - parentRectWidth/2 - edgeGap - rectWidth/2;
        }
        // ノードの座標を記録（エッジ描画用）
        node._pos = { x: nodeX, y: offsetY };
        drawEdge(parentId, id, side, nodeX, offsetY, parentRectWidth, rectWidth);
        const g = createNodeElement(id, node.content, node.style.fill, nodeX, offsetY, false);
        svg.appendChild(g);
        if (!node.collapsed && node.children.length > 0) {
          drawBranch(side, nodeX, offsetY, node.children, id, dir, depth + 1);
        }
        // 次の子ノードのY座標を計算
        if (idx < children.length - 1) {
          offsetY += (subtreeHeights[idx] + subtreeHeights[idx+1]) / 2 + nodeGapY;
        }
      });
    }

    // ノードSVG要素生成
    function createNodeElement(id, content, color, x, y, isRoot) {
      // グループ要素
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('class', 'node' + (selectedNodeId === id ? ' selected' : ''));
      g.setAttribute('transform', `translate(${x},${y})`);
      // テキスト幅を計算
      const minWidth = 120; // 最小幅
      const fontSize = isRoot ? 18 : 14;
      // 一時的にSVGテキスト要素を作成して幅を取得
      const tempText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      tempText.setAttribute('font-size', fontSize);
      tempText.setAttribute('font-family', 'sans-serif');
      tempText.textContent = content || '(空)';
      svg.appendChild(tempText);
      const bbox = tempText.getBBox();
      svg.removeChild(tempText);
      const textWidth = bbox.width + 32; // 余白を加算
      const rectWidth = Math.max(minWidth, textWidth);
      g.dataset.rectWidth = rectWidth; // 横幅をデータ属性で保持
      // ノード矩形
      const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      rect.setAttribute('x', -rectWidth/2); rect.setAttribute('y', -20); rect.setAttribute('width', rectWidth); rect.setAttribute('height', 40);
      rect.setAttribute('fill', color || '#fff');
      rect.setAttribute('stroke', '#888');
      rect.setAttribute('rx', 16); // 角丸
      rect.setAttribute('ry', 16); // 角丸
      g.appendChild(rect);
      // テキスト
      const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      text.setAttribute('x', 0); text.setAttribute('y', 5);
      text.setAttribute('text-anchor', 'middle');
      text.setAttribute('font-size', fontSize);
      text.setAttribute('font-family', 'sans-serif');
      text.textContent = content || '(空)';
      g.appendChild(text);
      // クリックイベント
      g.addEventListener('click', function(e) {
        e.stopPropagation();
        selectedNodeId = id;
        renderMindmap();
        openNodeEditor(id, isRoot);
      });
      return g;
    }

    // エッジ描画
    function drawEdge(parentId, childId, side, x, y, parentRectWidth, childRectWidth) {
      let from, to;
      if (parentId === 'root') {
        // ルートノードの横幅取得
        const tempText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        tempText.setAttribute('font-size', 18);
        tempText.setAttribute('font-family', 'sans-serif');
        tempText.textContent = mindmapData.root.content || '(空)';
        svg.appendChild(tempText);
        const bbox = tempText.getBBox();
        svg.removeChild(tempText);
        parentRectWidth = Math.max(120, bbox.width + 32);
        if (side === 'right') {
          from = { x: centerX + parentRectWidth/2, y: centerY };
          to = { x: x - childRectWidth/2, y: y };
        } else {
          from = { x: centerX - parentRectWidth/2, y: centerY };
          to = { x: x + childRectWidth/2, y: y };
        }
      } else {
        // 親ノードの座標を取得
        const parentNode = mindmapData.node_list[parentId];
        let parentX = x, parentY = y;
        if (parentNode && parentNode._pos) {
          parentX = parentNode._pos.x;
          parentY = parentNode._pos.y;
        }
        if (side === 'right') {
          from = { x: parentX + parentRectWidth/2, y: parentY };
          to = { x: x - childRectWidth/2, y: y };
        } else {
          from = { x: parentX - parentRectWidth/2, y: parentY };
          to = { x: x + childRectWidth/2, y: y };
        }
      }
      // 子ノードが1個だけで直線の場合は円弧不要
      const parentNode = parentId === 'root' ? null : mindmapData.node_list[parentId];
      let isStraight = false;
      if (parentNode && parentNode.children && parentNode.children.length === 1) {
        isStraight = true;
      }
      if (parentId === 'root') {
        const rootChildren = side === 'right' ? mindmapData.root.right.children : mindmapData.root.left.children;
        if (rootChildren.length === 1) isStraight = true;
      }
      if (isStraight) {
        // 直線のみ
        const d = `M${from.x},${from.y} L${to.x},${to.y}`;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);
        path.setAttribute('class', 'edge');
        path.setAttribute('fill', 'none');
        svg.appendChild(path);
        return;
      }
      // 直線主体＋曲がる部分のみ角丸（円弧）
      const radius = 10; // 角丸半径
      // 横→縦の折れ曲がり点
      const midX = side === 'right' ? from.x + 24 : from.x - 24;
      // 1. 横直線（from→midX,from.y）
      // 2. 円弧で90度曲げ（midX,from.y→midX,y）
      // 3. 縦直線（midX,y→to.x,y）
      let d = `M${from.x},${from.y}`;
      d += ` L${midX - (side === 'right' ? radius : -radius)},${from.y}`;
      // 円弧の向きを修正
      let arcSweep1 = 0, arcSweep2 = 0;
      if (side === 'right') {
        arcSweep1 = y > from.y ? 1 : 0;
        arcSweep2 = y > from.y ? 1 : 0;
      } else {
        arcSweep1 = y < from.y ? 1 : 0;
        arcSweep2 = y < from.y ? 1 : 0;
      }
      d += ` A${radius},${radius} 0 0,${arcSweep1} ${midX},${from.y + (y > from.y ? radius : -radius)}`;
      d += ` L${midX},${y - (y > from.y ? radius : -radius)}`;
      d += ` A${radius},${radius} 0 0,${arcSweep2} ${midX + (side === 'right' ? radius : -radius)},${y}`;
      d += ` L${to.x},${y}`;
      // パス要素作成
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d);
      path.setAttribute('class', 'edge');
      path.setAttribute('fill', 'none');
      svg.appendChild(path);
    }

    // --- ノード編集UI制御 ---
    const nodeEditor = document.getElementById('node-editor');
    const nodeContentInput = document.getElementById('node-content');
    const nodeColorInput = document.getElementById('node-color');
    const saveNodeBtn = document.getElementById('save-node');
    const deleteNodeBtn = document.getElementById('delete-node');
    const closeEditorBtn = document.getElementById('close-editor');

    // ノード編集UIを開く
    function openNodeEditor(id, isRoot) {
      selectedNodeId = id;
      renderMindmap();
      nodeEditor.style.display = 'block';
      if (isRoot) {
        nodeContentInput.value = mindmapData.root.content;
        nodeColorInput.value = mindmapData.root.style.fill || '#fff';
        deleteNodeBtn.style.display = 'none';
      } else {
        nodeContentInput.value = mindmapData.node_list[id].content;
        nodeColorInput.value = mindmapData.node_list[id].style.fill || '#fff';
        deleteNodeBtn.style.display = '';
      }
      // ルートノードかどうかを属性で保持
      nodeEditor.setAttribute('data-root', isRoot ? '1' : '0');
    }

    // 保存ボタン
    saveNodeBtn.onclick = function() {
      const isRoot = nodeEditor.getAttribute('data-root') === '1';
      if (isRoot) {
        updateRoot(nodeContentInput.value, nodeColorInput.value);
      } else if (selectedNodeId) {
        updateNode(selectedNodeId, nodeContentInput.value, nodeColorInput.value);
      }
      nodeEditor.style.display = 'none';
      renderMindmap();
    };

    // 削除ボタン
    deleteNodeBtn.onclick = function() {
      if (!selectedNodeId) return;
      // 親ノード・サイドを探索
      let parentId = null, side = null;
      // ルート直下
      ['left', 'right'].forEach(s => {
        if (mindmapData.root[s].children.includes(selectedNodeId)) {
          parentId = 'root'; side = s;
        }
      });
      // それ以外
      if (!parentId) {
        for (const pid in mindmapData.node_list) {
          if (mindmapData.node_list[pid].children.includes(selectedNodeId)) {
            parentId = pid; side = null;
          }
        }
      }
      if (parentId) deleteNode(selectedNodeId, parentId, side);
      nodeEditor.style.display = 'none';
      selectedNodeId = null;
      renderMindmap();
    };

    // 閉じるボタン
    closeEditorBtn.onclick = function() {
      nodeEditor.style.display = 'none';
      selectedNodeId = null;
      renderMindmap();
    };

    // --- インポート・エクスポート機能 ---
    const importBtn = document.getElementById('import-yaml');
    const exportBtn = document.getElementById('export-yaml');
    const fileInput = document.getElementById('yaml-import');

    // エクスポート処理
    exportBtn.onclick = function() {
      // YAML文字列に変換
      const yamlStr = jsyaml.dump(mindmapData, { skipInvalid: true, lineWidth: 120 });
      const blob = new Blob([yamlStr], { type: 'text/yaml' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'mindmap.yaml';
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
    };

    // インポートボタン押下でファイル選択
    importBtn.onclick = function() {
      fileInput.value = '';
      fileInput.click();
    };
    // ファイル選択時
    fileInput.onchange = function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        try {
          const data = jsyaml.load(ev.target.result);
          // データバリデーション（最低限: root, node_listがあるか）
          if (data && data.root && data.node_list) {
            mindmapData = data;
            selectedNodeId = null;
            nodeEditor.style.display = 'none';
            renderMindmap();
          } else {
            alert('YAML形式が不正です');
          }
        } catch (err) {
          alert('YAMLの読み込みに失敗しました');
        }
      };
      reader.readAsText(file);
    };

    // --- ドラッグ＆ドロップによるインポート対応 ---
    const canvasContainer = document.getElementById('canvas-container');
    // ドラッグオーバー時のデフォルト動作抑止
    canvasContainer.addEventListener('dragover', function(e) {
      e.preventDefault();
      canvasContainer.style.background = '#e3f2fd'; // ドロップ時の視覚効果
    });
    // ドラッグリーブ時に背景戻す
    canvasContainer.addEventListener('dragleave', function(e) {
      e.preventDefault();
      canvasContainer.style.background = '#fff';
    });
    // ドロップ時の処理
    canvasContainer.addEventListener('drop', function(e) {
      e.preventDefault();
      canvasContainer.style.background = '#fff';
      if (!e.dataTransfer.files || e.dataTransfer.files.length === 0) return;
      const file = e.dataTransfer.files[0];
      if (!file.name.match(/\.ya?ml$/i) && !file.name.match(/\.txt$/i)) {
        alert('YAMLファイルをドロップしてください');
        return;
      }
      const reader = new FileReader();
      reader.onload = function(ev) {
        try {
          const data = jsyaml.load(ev.target.result);
          if (data && data.root && data.node_list) {
            mindmapData = data;
            selectedNodeId = null;
            nodeEditor.style.display = 'none';
            renderMindmap();
          } else {
            alert('YAML形式が不正です');
          }
        } catch (err) {
          alert('YAMLの読み込みに失敗しました');
        }
      };
      reader.readAsText(file);
    });

    // --- キャンバス移動・拡大縮小 ---
    let viewX = 0, viewY = 0, scale = 1;
    let isPanning = false, startX = 0, startY = 0, startViewX = 0, startViewY = 0;

    // SVGのviewBoxで表示領域を制御
    function updateViewBox() {
      const w = svg.width.baseVal.value;
      const h = svg.height.baseVal.value;
      svg.setAttribute('viewBox', `${viewX} ${viewY} ${w/scale} ${h/scale}`);
    }

    // ドラッグで移動
    svg.addEventListener('mousedown', function(e) {
      if (e.button !== 0) return; // 左クリックのみ
      isPanning = true;
      startX = e.clientX;
      startY = e.clientY;
      startViewX = viewX;
      startViewY = viewY;
      svg.style.cursor = 'grabbing';
    });
    window.addEventListener('mousemove', function(e) {
      if (!isPanning) return;
      const dx = (e.clientX - startX) / scale;
      const dy = (e.clientY - startY) / scale;
      viewX = startViewX - dx;
      viewY = startViewY - dy;
      updateViewBox();
    });
    window.addEventListener('mouseup', function(e) {
      if (isPanning) {
        isPanning = false;
        svg.style.cursor = '';
      }
    });

    // ホイールで拡大縮小
    svg.addEventListener('wheel', function(e) {
      e.preventDefault();
      const oldScale = scale;
      if (e.deltaY < 0) {
        scale *= 1.1;
      } else {
        scale /= 1.1;
      }
      scale = Math.max(0.2, Math.min(3, scale));
      // マウス位置を中心に拡大縮小
      const rect = svg.getBoundingClientRect();
      const mx = (e.clientX - rect.left) / rect.width * svg.width.baseVal.value;
      const my = (e.clientY - rect.top) / rect.height * svg.height.baseVal.value;
      viewX = mx - (mx - viewX) * (scale / oldScale);
      viewY = my - (my - viewY) * (scale / oldScale);
      updateViewBox();
    }, { passive: false });

    // キャンバスサイズをウィンドウサイズに合わせる
    function resizeCanvas() {
      const w = window.innerWidth;
      const h = window.innerHeight - document.getElementById('toolbar').offsetHeight;
      svg.setAttribute('width', w);
      svg.setAttribute('height', h);
      svg.style.width = w + 'px';
      svg.style.height = h + 'px';
      canvasContainer.style.width = w + 'px';
      canvasContainer.style.height = h + 'px';
      canvasContainer.style.overflow = 'hidden';
      updateViewBox();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- 初回表示時にマップを中心に ---
    function centerMap() {
      // SVGサイズ取得
      const w = svg.width.baseVal.value;
      const h = svg.height.baseVal.value;
      // マップの中心座標（ルートノード基準）
      viewX = centerX - w / 2;
      viewY = centerY - h / 2;
      scale = 1;
      updateViewBox();
    }
    // 初期化時に中心表示
    centerMap();

    // 全体表示ボタン
    document.getElementById('fit-canvas').onclick = function() {
      centerMap();
    };

    // 初期描画
    renderMindmap();
    // SVGクリックで選択解除
    svg.addEventListener('click', function(e) {
      // ノード以外をクリックした場合のみ選択解除
      if (e.target === svg) {
        selectedNodeId = null;
        document.getElementById('node-editor').style.display = 'none';
        renderMindmap();
      }
    });
    // --- コメントは日本語で簡潔に記述 ---
  </script>
</body>
</html>
